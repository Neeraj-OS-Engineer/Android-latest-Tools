plugins {
    id 'com.android.application'
}

android {
    compileSdk 34   // or 35

    defaultConfig {
        applicationId "com.ns.dev.jdkhandlookingdeep"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // LibGDX requires this for native code
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Required for MediaPipe AARs (if using local or specific repositories)
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout

    
    // ---------- AndroidX & Material ----------
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // ---------- LibGDX Core & Android ----------
    def gdxVersion = '1.12.1'
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

    // (Optional) For 3D physics / collision – uncomment if needed
    // implementation "com.badlogicgames.gdx:gdx-bullet:$gdxVersion"
    // implementation "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-armeabi-v7a"

    // ---------- MediaPipe (Hand Tracking) ----------
    // MediaPipe solution core and vision tasks
    implementation 'com.google.mediapipe:mediapipe-android:0.10.14'          // Core MediaPipe library
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'              // Vision tasks (hand tracking)
    // Required for CameraX integration (MediaPipe uses CameraX by default)
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    // ---------- ExoPlayer (Media3) ----------
    def media3Version = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"    // For HLS streaming
    implementation "androidx.media3:media3-ui:$media3Version"               // Player UI components
    implementation "androidx.media3:media3-session:$media3Version"          // Media session

    // ---------- Utilities ----------
    // For Glassmorphism effects (blur, etc.) – optional, can be done with RenderScript or Android 12+ APIs
    // implementation 'androidx.renderscript:renderscript:1.0.3'
}

repositories {
    google()
    mavenCentral()
    // MediaPipe may require this if not in Google's repo (usually it is)
    // maven { url 'https://jitpack.io' }
}

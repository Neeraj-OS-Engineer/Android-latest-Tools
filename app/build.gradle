plugins {
    id 'com.android.application'
}

android {
    namespace "com.ns.dev.jdkhandlookingdeep"
    compileSdk 34

    defaultConfig {
        applicationId "com.ns.dev.jdkhandlookingdeep"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // LibGDX aur MediaPipe ke liye in dono ka hona kaafi hai
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // CRITICAL: Media3 aur MediaPipe 0.10+ ke liye Java 17 mandatory hai
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/NOTICE'
            excludes += 'META-INF/LICENSE'
            excludes += 'META-INF/LICENSE.txt'
            excludes += 'META-INF/NOTICE.txt'
            excludes += 'META-INF/ASL2.0'
            excludes += 'META-INF/*.kotlin_module' // Kotlin files ko nikaalne ke liye
        }
    }
}

dependencies {
    // AndroidX & Material (KOTLIN KTX NIKAL DIYA HAI)
    implementation libs.androidx.core      // core-ktx ki jagah sirf core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.constraintlayout

    // LibGDX (3D Engine)
    implementation libs.gdx
    implementation libs.gdx.android

    // LibGDX platform natives (Cleaner way using your TOML logic)
    runtimeOnly libs.gdx.natives.arm64
    runtimeOnly libs.gdx.natives.armeabi

    // MediaPipe - FIX: Sirf tasks-vision kaafi hai
    // 'mediapipe-android' dhoondne par error aa raha tha server pe
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    
    // CameraX
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view

    // ExoPlayer (Media3)
    implementation libs.media3.exoplayer
    implementation libs.media3.ui
    implementation libs.media3.session

    // Gson
    implementation libs.gson
}

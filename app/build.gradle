plugins {
    id 'com.android.application'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.ns.dev.jdkhandlookingdeep"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }
}

dependencies {
    // AndroidX & Material
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.constraintlayout

    // LibGDX
    implementation libs.gdx
    implementation libs.gdx.android
    implementation libs.gdx.platform.armv7
    implementation libs.gdx.platform.arm64
    implementation libs.gdx.platform.x86
    implementation libs.gdx.platform.x86_64

    // MediaPipe
    implementation libs.mediapipe
    implementation libs.mediapipe.tasks.vision
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view

    // ExoPlayer (Media3)
    implementation libs.media3.exoplayer
    implementation libs.media3.hls
    implementation libs.media3.ui
    implementation libs.media3.session

    // Gson
    implementation libs.gson
}

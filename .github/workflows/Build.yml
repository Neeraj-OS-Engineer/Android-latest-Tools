name: Android Spatial Player Build

on:
  # Jab bhi aap 'main' branch par push karenge, build shuru ho jayegi
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Manual trigger ke liye
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # LibGDX aur MediaPipe ke liye NDK bahut zaruri hai
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c # Aapke build.gradle ke version se match karta hua
          add-to-path: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Build hone ke baad APK ko GitHub par upload karna
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpatialPlayer-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

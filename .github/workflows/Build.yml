name: Android Spatial Player Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better debugging

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          # NDK version aapke build.gradle se match honi chahiye
          log-accepted-android-sdk-licenses: true

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

      # FIX: JAR Access Error ko khatam karne ke liye execute permission
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # OPTIMIZATION: Gradle Daemon ko zyada memory dena
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          JAVA_OPTS: "-Xmx3072m"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpatialPlayer-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

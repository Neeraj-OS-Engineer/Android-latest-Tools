name: Android Spatial Player Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      # Yahan hum permissions 'app' folder ke andar wale gradlew ko de rahe hain
      - name: Grant execute permission for gradlew
        run: chmod +x app/gradlew

      # Sabse important step: working-directory ko 'app' par set karna
      - name: Build Debug APK
        working-directory: ./app
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpatialPlayer-Debug-APK
          path: app/app/build/outputs/apk/debug/app-debug.apk

[versions]
# Build Tools
agp = "8.1.0"
androidxCore = "1.12.0"
androidxAppcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.2.0"

# Core Engine: LibGDX (3D Spatial Rendering)
gdx = "1.12.1"

# AI/ML: MediaPipe (Hand Tracking)
# 0.10.14 is the industry standard for stable Java integration
mediapipe = "0.10.14" 

# Media: Media3 (ExoPlayer for Audio/Video)
media3 = "1.4.1"

# Camera & Utilities
camera = "1.4.1"
gson = "2.10.1"

[libraries]
# --- AndroidX & UI (No Kotlin KTX) ---
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# --- LibGDX (The 3D Engine) ---
gdx = { group = "com.badlogicgames.gdx", name = "gdx", version.ref = "gdx" }
gdx-backend-android = { group = "com.badlogicgames.gdx", name = "gdx-backend-android", version.ref = "gdx" }
# Critical: Natives for ARM (Essential for Physical Devices)
gdx-natives-arm64 = { group = "com.badlogicgames.gdx", name = "gdx-platform", version.ref = "gdx", classifier = "natives-arm64-v8a" }
gdx-natives-armeabi = { group = "com.badlogicgames.gdx", name = "gdx-platform", version.ref = "gdx", classifier = "natives-armeabi-v7a" }

# --- MediaPipe (Hand Gesture Logic) ---
mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipe" }

# --- CameraX (Pure Java Feed) ---
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camera" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camera" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camera" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camera" }

# --- Media3 (Modern ExoPlayer Bundle) ---
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

# --- Utilities ---
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
